# Set BOT_TOKEN and VOICE_FILE_ID in .env, then: docker compose up -d
services:
  bot:
    image: denoland/deno:2.9.6
    restart: unless-stopped
    init: true
    working_dir: /app
    env_file:
      - .env
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      VOICE_FILE_ID: ${VOICE_FILE_ID:-}
      DENO_DIR: /data/deno
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://signoz-ingester:4318}
    volumes:
      - ./bot.ts:/app/bot.ts:ro,Z
      - ./oh-yeah.ogg:/app/oh-yeah.ogg:ro,Z
      - bot-data:/data
    entrypoint: ["deno"]
    command:
      - run
      - --no-lock
      - --allow-env
      - --allow-net
      - --allow-read
      - --allow-sys
      - bot.ts
    networks:
      - dev-infra

volumes:
  bot-data:

networks:
  dev-infra:
    name: dev-infra
    external: true
